<script>
/* ============================== ENGINE ==============================
   Same grading decision engine used for both My Cards and Pokémon: same
   $20 minimum-sell bar, same PSA-via-Australia declared-value tiers, same
   PSA10-floors-at-PSA9-when-unknown fix.
   ===================================================================== */
const AUD_TO_USD = 0.65;
const PSA9_GRADES = ['psa 9','sgc 9','bgs 9','bgs 9.5'];
const PSA10_GRADES = ['psa 10','sgc 10','bgs 10'];
const SPORT_OPTIONS = ['NFL','NBA','WNBA','MLB','AFL','Soccer','MMA','WWE','Other'];
const STATUS_OPTIONS = ['Raw','At Grading','Graded','Listed','Sold'];

function tieredPsaAuCost(declaredAUD){
  const usd = (declaredAUD||0) * AUD_TO_USD;
  if(usd<=500) return 50;
  if(usd<=1000) return 140;
  if(usd<=1500) return 165;
  if(usd<=2500) return 299;
  if(usd<=5000) return 699;
  if(usd<=10000) return 1199;
  return 2199;
}
function gradingCost(service, declaredAUD){
  if(!service) return 0;
  const s = service.toLowerCase();
  if(s.includes('australia')) return tieredPsaAuCost(declaredAUD);
  if(s.includes('shipmycards') || s.includes('usa')) return 38.9;
  if(s.includes('sgc')) return 39.95;
  return 0;
}
function fmtMoney(n){
  if(n==null || isNaN(n)) return '—';
  const s = n<0 ? '-' : '';
  return s + '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtPct(n){ return n==null ? '—' : (n*100).toFixed(1)+'%'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeCard(c){
  const holdingCost = c.shipMyCards === 'ShipMyCards' ? 4.5 : 0;
  const totalCost = (Number(c.paid)||0) + (Number(c.shipping)||0) + holdingCost + (Number(c.gradingCostPaid)||0);
  const fees = c.feesPct!=null ? Number(c.feesPct) : 0.137;
  const status = c.status || 'Raw';
  const isActive = status==='Raw' || status==='Graded';
  const grade = (c.grade||'').toLowerCase();

  const hasRaw = c.rawAvg!=null && c.rawAvg!=='';
  const hasPsa9 = c.psa9Avg!=null && c.psa9Avg!=='';
  const hasPsa10Own = c.psa10Avg!=null && c.psa10Avg!=='';
  const raw = hasRaw ? Number(c.rawAvg) : null;
  const psa9 = hasPsa9 ? Number(c.psa9Avg) : null;
  const psa10 = hasPsa10Own ? Number(c.psa10Avg) : (hasPsa9 ? psa9 : null);
  const hasPsa10 = psa10!=null;

  const declaredValue = Math.max(psa9||0, psa10||0, raw||0);
  const gCost = gradingCost(c.gradingService, declaredValue);

  const rawGGR = (isActive && hasRaw && status!=='Graded') ? (raw*(1-fees) - totalCost) : null;
  const psa9GGR = (isActive && hasPsa9) ? (psa9*(1-fees) - totalCost - gCost) : null;
  const psa10GGR = (isActive && hasPsa10) ? (psa10*(1-fees) - totalCost - gCost) : null;

  let gradeWorthIt = 'NO';
  if(psa10GGR!=null && psa9GGR!=null){
    if(psa10GGR>=20 && psa9GGR>=0) gradeWorthIt='YES';
    else if(psa10GGR>=20 && psa9GGR>=-10 && psa9GGR<0) gradeWorthIt='HIGH RISK';
  }

  let gradedEV = null;
  if(isActive && status!=='Graded' && (psa10GGR!=null || psa9GGR!=null)){
    gradedEV = 0.35*(psa10GGR??0) + 0.45*(psa9GGR??0);
  }

  let sellDecision = '';
  if(!c.player) sellDecision='';
  else if(status==='Sold') sellDecision='Sold';
  else if(status==='Listed') sellDecision='Listed';
  else if(status==='At Grading') sellDecision='At Grading';
  else if(status==='Graded'){
    if(PSA10_GRADES.includes(grade) && psa10GGR!=null && psa10GGR>=20) sellDecision='Sell PSA 10';
    else if(PSA9_GRADES.includes(grade) && psa9GGR!=null && psa9GGR>=5) sellDecision='Sell PSA 9';
    else sellDecision='Hold';
  } else {
    const gradeFirst = gradeWorthIt!=='NO' && psa10GGR!=null && rawGGR!=null && psa10GGR>rawGGR;
    if(gradeFirst) sellDecision='Grade First';
    else if(rawGGR!=null){
      const threshAbs = totalCost<=30 ? Math.max(5,totalCost*0.15) : Math.max(20,totalCost*0.2);
      const threshPct = totalCost<=30 ? 0.15 : 0.2;
      const sellRawFirst = rawGGR>=threshAbs || (totalCost>0 && rawGGR/totalCost>=threshPct);
      sellDecision = sellRawFirst ? 'Sell Raw First' : 'Hold';
    } else sellDecision = 'Hold';
  }

  const gradeCall = status!=='Raw' ? 'NO' : (sellDecision==='Sell Raw First' ? 'NO' : gradeWorthIt);

  let sellPriority = 9;
  if(sellDecision==='Sell PSA 9'||sellDecision==='Sell PSA 10') sellPriority=1;
  else if(sellDecision==='Sell Raw First') sellPriority=2;
  else if(sellDecision==='Grade First' && gradeCall==='YES') sellPriority=3;
  else if(sellDecision==='Grade First' && gradeCall==='HIGH RISK') sellPriority=4;
  else if(sellDecision==='Grade First') sellPriority=5;
  else if(sellDecision==='Hold') sellPriority=6;
  else if(sellDecision==='At Grading') sellPriority=6.5;
  else if(sellDecision==='Listed') sellPriority=7;
  else if(sellDecision==='Sold') sellPriority=8;

  const netSale = c.actualSellPrice!=null && c.actualSellPrice!=='' ? Number(c.actualSellPrice)*(1-fees) : null;
  const realisedProfit = netSale!=null ? netSale - totalCost : null;

  return {...c, totalCost, rawGGR, psa9GGR, psa10GGR, gradedEV, gradeCall, gradingCostValue:gCost,
           sellDecision, sellPriority, realisedProfit, hasRaw, hasPsa9, hasPsa10};
}

const SELL_STYLE = {
  'Sell Raw First':{color:'var(--green)',label:'Sell Raw First'},
  'Sell PSA 9':{color:'var(--green)',label:'Sell PSA 9'},
  'Sell PSA 10':{color:'var(--green)',label:'Sell PSA 10'},
  'Grade First':{color:'var(--purple)',label:'Grade First'},
  'Hold':{color:'var(--text-dim)',label:'Hold'},
  'At Grading':{color:'var(--gold)',label:'At Grading'},
  'Listed':{color:'var(--blue)',label:'Listed'},
  'Sold':{color:'var(--text-dim)',label:'Sold'},
  '':{color:'var(--text-dim)',label:'—'}
};

/* ============================== STORAGE / SYNC ==============================
   Supabase realtime is the source of truth when reachable; localStorage is a
   read/write cache used offline and as the seed on first run.
   ============================================================================ */
const ROW_ID = 'tandem-shared';
const LOCAL_KEY = 'tandem_cache_v1';
let supabaseClient = null;
let state = { cards: [], pokemonCards: [], boxBreaks: [], targets: [], manualExpenses: [] };
let channel = null;

function ensureStateShape(){
  state.cards = state.cards || [];
  state.pokemonCards = state.pokemonCards || [];
  state.boxBreaks = state.boxBreaks || [];
  state.targets = state.targets || [];
  state.manualExpenses = state.manualExpenses || [];
}

function loadLocal(){
  try{ const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ console.error('local load failed', e); return null; }
}
function saveLocal(s){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); }
  catch(e){ console.error('local save failed', e); }
}
function setSyncStatus(text, color){
  const el = document.getElementById('syncStatus');
  el.innerHTML = `<span class="sync-dot" style="background:${color}"></span>${text}`;
}

async function initSupabase(){
  if(!window.supabase || !window.SUPABASE_URL || window.SUPABASE_URL.includes('YOUR_')){
    setSyncStatus('Local only (no Supabase configured)', 'var(--text-dim)');
    return false;
  }
  try{
    supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    return true;
  }catch(e){
    console.error('Supabase init failed', e);
    setSyncStatus('Local only (init failed)', 'var(--red)');
    return false;
  }
}

async function loadState(){
  const cached = loadLocal();
  if(cached) state = cached;
  ensureStateShape();

  if(!supabaseClient){ render(); return; }
  setSyncStatus('Syncing…', 'var(--gold)');
  try{
    const { data, error } = await supabaseClient.from('tandem_state').select('*').eq('id', ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.payload){
      state = data.payload;
      ensureStateShape();
      saveLocal(state);
      setSyncStatus('Synced', 'var(--green)');
    } else if(cached){
      await supabaseClient.from('tandem_state').upsert({ id: ROW_ID, payload: state, updated_at: new Date().toISOString() });
      setSyncStatus('Synced', 'var(--green)');
    } else {
      setSyncStatus('Synced (empty)', 'var(--green)');
    }
  }catch(e){
    console.warn('Supabase load failed, using local cache', e);
    setSyncStatus('Offline — using local copy', 'var(--red)');
  }
  render();
  subscribeRealtime();
}

async function saveState(){
  ensureStateShape();
  saveLocal(state);
  if(!supabaseClient || !navigator.onLine){
    setSyncStatus(navigator.onLine ? 'Local only' : 'Offline — saved locally', 'var(--text-dim)');
    return;
  }
  try{
    const { error } = await supabaseClient.from('tandem_state').upsert({ id: ROW_ID, payload: state, updated_at: new Date().toISOString() });
    if(error) throw error;
    setSyncStatus('Synced', 'var(--green)');
  }catch(e){
    console.warn('Supabase save failed, will retry on reconnect', e);
    setSyncStatus('Save pending — will retry', 'var(--red)');
  }
}

function subscribeRealtime(){
  if(!supabaseClient || channel) return;
  channel = supabaseClient.channel('public:tandem_state')
    .on('postgres_changes', { event:'*', schema:'public', table:'tandem_state', filter:`id=eq.${ROW_ID}` }, (payload) => {
      if(payload.new && payload.new.payload){
        state = payload.new.payload;
        ensureStateShape();
        saveLocal(state);
        render();
        setSyncStatus('Synced (updated elsewhere)', 'var(--green)');
      }
    })
    .subscribe();
}

window.addEventListener('online', () => { setSyncStatus('Reconnecting…','var(--gold)'); saveState(); });
window.addEventListener('offline', () => setSyncStatus('Offline — using local copy','var(--red)'));

/* ============================== TAB ROUTER ============================== */
const TABS = [
  { id:'home', label:'Home', ready:true },
  { id:'cards', label:'My Cards', ready:true },
  { id:'pokemon', label:'Pokémon', ready:true },
  { id:'sales', label:'My Sales', ready:true },
  { id:'boxbreaks', label:'Box Breaks', ready:true },
  { id:'gradecheck', label:'Grade Check', ready:false },
  { id:'gradingtracker', label:'Grading Tracker', ready:false },
  { id:'lotscanner', label:'Lot Scanner', ready:false },
  { id:'targets', label:'Monthly Targets', ready:true },
  { id:'playbook', label:'Selling Playbook', ready:true },
  { id:'business', label:'Business Summary', ready:true },
  { id:'content', label:'Content Creation', ready:false },
  { id:'buyeval', label:'Buy Evaluator', ready:false },
  { id:'tips', label:'Tips & Tricks', ready:true },
];
let currentTab = 'home';

function renderTabbar(){
  document.getElementById('tabbar').innerHTML = TABS.map(t =>
    `<button class="tabbtn ${t.id===currentTab?'active':''}" data-tab="${t.id}" ${t.ready?'':'disabled title="Coming soon — not yet built in this version"'}>${t.label}${t.ready?'':' 🔜'}</button>`
  ).join('');
  document.querySelectorAll('.tabbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ if(!btn.disabled){ currentTab = btn.dataset.tab; render(); } });
  });
}

function render(){
  renderTabbar();
  const root = document.getElementById('tabContent');
  const tab = TABS.find(t=>t.id===currentTab);
  if(!tab || !tab.ready){
    root.innerHTML = `<div class="soon"><div class="oswald" style="font-size:16px;color:var(--text);margin-bottom:6px">${tab?tab.label:''} — coming next</div>This tool needs its own dedicated build (AI image analysis, live auction math, or ledger accounting) to do properly rather than a rushed port. Ask for it directly and it'll get built with the same care as everything else.</div>`;
    return;
  }
  const renderers = {
    home: renderHome, cards: ()=>renderCardTab('cards'), pokemon: ()=>renderCardTab('pokemon'),
    sales: renderSales, boxbreaks: renderBoxBreaks, targets: renderTargets,
    playbook: renderPlaybook, business: renderBusiness, tips: renderTips,
  };
  (renderers[currentTab] || (()=>{root.innerHTML='';}))();
}

/* ============================== HOME ============================== */
function renderHome(){
  const cardsC = state.cards.map(computeCard);
  const pkmnC = state.pokemonCards.map(computeCard);
  const all = [...cardsC, ...pkmnC];
  const active = all.filter(c=>c.status!=='Sold');
  const invested = active.reduce((s,c)=>s+c.totalCost*(Number(c.quantity)||1),0);
  const potential = active.reduce((s,c)=>s+(c.rawGGR??c.gradedEV??0)*(Number(c.quantity)||1),0);
  const realised = all.filter(c=>c.status==='Sold').reduce((s,c)=>s+(c.realisedProfit||0)*(Number(c.quantity)||1),0);
  const needsAttention = all.filter(c=>c.sellPriority<=2).sort((a,b)=>a.sellPriority-b.sellPriority).slice(0,5);
  const watching = state.targets.filter(t=>t.status==='Watching');

  document.getElementById('tabContent').innerHTML = `
    <div class="stat-bar">
      <div class="stat"><div class="label">Invested</div><div class="value">${fmtMoney(invested)}</div></div>
      <div class="stat"><div class="label">Potential profit</div><div class="value" style="color:${potential>=0?'var(--green)':'var(--red)'}">${fmtMoney(potential)}</div></div>
      <div class="stat"><div class="label">Realised profit</div><div class="value" style="color:${realised>=0?'var(--green)':'var(--red)'}">${fmtMoney(realised)}</div></div>
      <div class="stat"><div class="label">Box breaks</div><div class="value">${state.boxBreaks.length}</div></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <div class="oswald" style="font-size:15px;margin-bottom:10px">⚡ Needs your attention</div>
        ${needsAttention.length===0 ? '<div style="font-size:12px;color:var(--text-dim)">Nothing flagged to sell right now.</div>' :
          needsAttention.map(c=>`<div class="dash-row" data-goto="${c.player&&state.cards.includes ? '' : ''}"><span>${esc(c.player)}</span><span class="badge" style="background:${(SELL_STYLE[c.sellDecision]||SELL_STYLE['']).color}22;color:${(SELL_STYLE[c.sellDecision]||SELL_STYLE['']).color}">${c.sellDecision}</span></div>`).join('')}
      </div>
      <div class="panel">
        <div class="oswald" style="font-size:15px;margin-bottom:10px">🎯 Monthly Targets — Watching</div>
        ${watching.length===0 ? '<div style="font-size:12px;color:var(--text-dim)">No targets being watched.</div>' :
          watching.slice(0,5).map(t=>`<div class="dash-row"><span>${esc(t.player)}</span><span class="mono" style="font-size:11px;color:var(--gold)">${t.researchScore??'—'}</span></div>`).join('')}
      </div>
    </div>
  `;
}

/* ============================== MY CARDS / POKÉMON (shared) ============================== */
let filters = { cards:{status:'all',decision:'all'}, pokemon:{status:'all',decision:'all'} };

function renderCardTab(key){
  const arr = state[key==='cards' ? 'cards' : 'pokemonCards'];
  const computed = arr.map(computeCard).sort((a,b)=>a.sellPriority-b.sellPriority || b.totalCost-a.totalCost);
  const f = filters[key];
  const statuses = [...new Set(computed.map(c=>c.status))];
  const decisions = [...new Set(computed.map(c=>c.sellDecision).filter(Boolean))];

  let visible = computed;
  if(f.status!=='all') visible = visible.filter(c=>c.status===f.status);
  if(f.decision!=='all') visible = visible.filter(c=>c.sellDecision===f.decision);

  const invested = computed.filter(c=>c.status!=='Sold').reduce((s,c)=>s+c.totalCost*(Number(c.quantity)||1),0);
  const potential = computed.filter(c=>c.status!=='Sold').reduce((s,c)=>s+(c.rawGGR??c.gradedEV??0)*(Number(c.quantity)||1),0);

  document.getElementById('tabContent').innerHTML = `
    <div class="stat-bar">
      <div class="stat"><div class="label">Cards</div><div class="value">${computed.length}</div></div>
      <div class="stat"><div class="label">Invested</div><div class="value">${fmtMoney(invested)}</div></div>
      <div class="stat"><div class="label">Potential profit</div><div class="value" style="color:${potential>=0?'var(--green)':'var(--red)'}">${fmtMoney(potential)}</div></div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <select id="cf_status" style="width:auto"><option value="all">All statuses</option>${statuses.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <select id="cf_decision" style="width:auto"><option value="all">All decisions</option>${decisions.map(d=>`<option value="${d}" ${f.decision===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>
      <button class="btn btn-primary" id="cAddBtn">+ Add ${key==='cards'?'card':'Pokémon card'}</button>
    </div>
    <div id="cList"></div>
  `;
  document.getElementById('cf_status').addEventListener('change', e=>{ f.status=e.target.value; renderCardTab(key); });
  document.getElementById('cf_decision').addEventListener('change', e=>{ f.decision=e.target.value; renderCardTab(key); });
  document.getElementById('cAddBtn').addEventListener('click', ()=> openCardModal(key, newCard(), true));

  const list = document.getElementById('cList');
  if(visible.length===0){ list.innerHTML = '<div class="empty">No cards match — add one, or clear filters.</div>'; return; }
  list.innerHTML = visible.map(c=>{
    const style = SELL_STYLE[c.sellDecision] || SELL_STYLE[''];
    const isTop = c.sellPriority===1;
    const isRawSell = c.sellDecision==='Sell Raw First';
    const cls = isTop ? 'top' : (isRawSell ? 'raw-sell' : '');
    return `
    <div class="card-row ${cls}" style="--accent:${style.color}" data-id="${c.id}">
      <div class="row">
        <div>
          <div class="oswald" style="font-size:15px;font-weight:600">${esc(c.player)||'Unnamed'} <span class="mono" style="font-size:10px;color:var(--text-dim)">${esc(c.sport)}</span></div>
          <div style="font-size:12px;color:var(--text-dim)">${esc(c.card)||''} ${c.cardNum?('#'+esc(c.cardNum)):''}</div>
        </div>
        <div style="text-align:right">
          <span class="badge" style="background:${style.color}22;color:${style.color}">${style.label}</span>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px">${fmtMoney(c.totalCost)} cost</div>
        </div>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.card-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const c = arr.find(x=>x.id===el.dataset.id);
      if(c) openCardModal(key, c, false);
    });
  });
}

/* ============================== BOX BREAKS ============================== */
function boxTotals(box){
  const cost = Number(box.cost)||0;
  const revenue = (box.spots||[]).reduce((s,sp)=>s+(Number(sp.soldPrice)||0),0);
  return { cost, revenue, profit: revenue-cost };
}
function renderBoxBreaks(){
  const totalProfit = state.boxBreaks.reduce((s,b)=>s+boxTotals(b).profit,0);
  document.getElementById('tabContent').innerHTML = `
    <div class="stat-bar">
      <div class="stat"><div class="label">Boxes</div><div class="value">${state.boxBreaks.length}</div></div>
      <div class="stat"><div class="label">Total profit</div><div class="value" style="color:${totalProfit>=0?'var(--green)':'var(--red)'}">${fmtMoney(totalProfit)}</div></div>
    </div>
    <div class="row" style="margin-bottom:14px"><div></div><button class="btn btn-primary" id="bbAdd">+ Add box break</button></div>
    <div id="bbList"></div>
  `;
  document.getElementById('bbAdd').addEventListener('click', ()=>{
    state.boxBreaks = [{ id:crypto.randomUUID(), name:'New box', cost:0, date:new Date().toISOString().slice(0,10), spots:[] }, ...state.boxBreaks];
    saveState(); renderBoxBreaks();
  });
  const list = document.getElementById('bbList');
  if(state.boxBreaks.length===0){ list.innerHTML = '<div class="empty">No box breaks logged yet.</div>'; return; }
  list.innerHTML = state.boxBreaks.map(b=>{
    const t = boxTotals(b);
    return `<div class="panel">
      <div class="row" style="margin-bottom:8px">
        <input value="${esc(b.name)}" data-bb="${b.id}" data-f="name" style="max-width:220px;font-weight:600" />
        <div style="display:flex;gap:8px;align-items:center">
          <input type="number" step="0.01" value="${b.cost}" data-bb="${b.id}" data-f="cost" style="width:100px" title="Box cost" />
          <button class="btn btn-sm btn-danger" data-del="${b.id}">Remove</button>
        </div>
      </div>
      <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px">Cost ${fmtMoney(t.cost)} · Revenue ${fmtMoney(t.revenue)} · Profit <span style="color:${t.profit>=0?'var(--green)':'var(--red)'}">${fmtMoney(t.profit)}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${(b.spots||[]).map((sp,i)=>`<span class="mono" style="font-size:11px;padding:4px 8px;border-radius:6px;background:var(--surface2)">${esc(sp.team)}: ${fmtMoney(sp.soldPrice)}</span>`).join('')}
        <button class="btn btn-sm" data-addspot="${b.id}">+ Spot</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('input[data-bb]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const box = state.boxBreaks.find(b=>b.id===inp.dataset.bb);
      if(!box) return;
      box[inp.dataset.f] = inp.dataset.f==='cost' ? Number(inp.value)||0 : inp.value;
      saveState(); renderBoxBreaks();
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.boxBreaks = state.boxBreaks.filter(b=>b.id!==btn.dataset.del); saveState(); renderBoxBreaks(); });
  });
  list.querySelectorAll('[data-addspot]').forEach(btn=>{
    btn.addEventListener('click', ()=>{

      const price = Number(prompt('Sold price (0 if unsold):','0'))||0;

      box.spots = [...(box.spots||[]), {team,soldPrice:price}];
      saveState(); renderBoxBreaks();
    });
  });
}

/* ============================== MONTHLY TARGETS ============================== */
function computeConfidence(t){
  const base = Number(t.researchScore)||0;
  if(!t.lastRefreshed) return base;
  const months = (Date.now() - new Date(t.lastRefreshed).getTime()) / (1000*60*60*24*30);
  const graceMonths = 1;
  if(months<=graceMonths) return base;
  const decayRate = t.performanceTrend==='Improving' ? 0.35*5 : t.performanceTrend==='Declining' ? 1.8*5 : 5;
  const decay = Math.min(30, (months-graceMonths)*decayRate);
  return Math.max(0, Math.round(base-decay));
}
function renderTargets(){
  const sorted = [...state.targets].sort((a,b)=>computeConfidence(b)-computeConfidence(a));
  document.getElementById('tabContent').innerHTML = `
    <div class="row" style="margin-bottom:14px"><div class="oswald" style="font-size:15px">${state.targets.length} targets</div><button class="btn btn-primary" id="tgAdd">+ Add target</button></div>
    <div id="tgList"></div>
  `;
  document.getElementById('tgAdd').addEventListener('click', ()=>{
    const player = prompt('Player name:'); if(!player) return;
    state.targets = [{ id:crypto.randomUUID(), player, sport:'NFL', cardToLookFor:'', tier:'Speculative',
      researchScore:40, performanceTrend:'Stable', reasoning:'', status:'Watching', lastRefreshed:new Date().toISOString().slice(0,10) }, ...state.targets];
    saveState(); renderTargets();
  });
  const list = document.getElementById('tgList');
  if(sorted.length===0){ list.innerHTML = '<div class="empty">No targets yet.</div>'; return; }
  list.innerHTML = sorted.map(t=>{
    const score = computeConfidence(t);
    const color = score>=70?'var(--green)':score>=50?'var(--gold)':score>=30?'#C9A227':'var(--red)';
    return `<div class="card-row">
      <div class="row">
        <div><div class="oswald" style="font-weight:600">${esc(t.player)} <span class="mono" style="font-size:10px;color:var(--text-dim)">${esc(t.sport)}</span></div>
        <div style="font-size:12px;color:var(--text-dim)">${esc(t.cardToLookFor)}</div></div>
        <div style="text-align:right"><span class="mono" style="font-weight:700;color:${color}">${score}</span>
        <div style="font-size:11px;color:var(--text-dim)">${esc(t.status)}</div></div>
      </div>
    </div>`;
  }).join('');
}

/* ============================== BUSINESS SUMMARY ============================== */
function currentFYLabel(){
  const d = new Date(); const y = d.getFullYear(); const m = d.getMonth()+1;
  return m>=7 ? `${y}-${String(y+1).slice(2)}` : `${y-1}-${String(y).slice(2)}`;
}
function fyBounds(label){
  const startYear = Number(label.split('-')[0]);
  return { start:`${startYear}-07-01`, end:`${startYear+1}-06-30` };
}
let bizPeriod = currentFYLabel();
function renderBusiness(){
  const { start, end } = bizPeriod==='all' ? {start:'0000-01-01',end:'9999-12-31'} : fyBounds(bizPeriod);
  const inRange = d => d && d>=start && d<=end;

  const allCards = [...state.cards, ...state.pokemonCards].map(computeCard);
  const rows = [];
  allCards.filter(c=>c.status==='Sold' && inRange(c.dateSold)).forEach(c=>{
    rows.push({ date:c.dateSold, type:'Card sale', desc:c.player, revenue:Number(c.actualSellPrice)||0, cost:c.totalCost, profit:c.realisedProfit||0 });
  });
  allCards.filter(c=>c.status!=='Sold' && inRange(c.datePurchased)).forEach(c=>{
    const cost = (Number(c.paid)||0)+(Number(c.shipping)||0);
    rows.push({ date:c.datePurchased, type:'Card purchase', desc:c.player, revenue:0, cost, profit:-cost });
  });
  state.boxBreaks.filter(b=>inRange(b.date)).forEach(b=>{
    const t = boxTotals(b);
    rows.push({ date:b.date, type:'Box break', desc:b.name, revenue:t.revenue, cost:t.cost, profit:t.profit });
  });
  state.manualExpenses.filter(e=>inRange(e.date)).forEach(e=>{
    rows.push({ date:e.date, type:'Manual expense', desc:e.description, revenue:0, cost:Number(e.amount)||0, profit:-(Number(e.amount)||0) });
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const totalRevenue = rows.reduce((s,r)=>s+r.revenue,0);
  const totalCost = rows.reduce((s,r)=>s+r.cost,0);
  const totalProfit = rows.reduce((s,r)=>s+r.profit,0);

  document.getElementById('tabContent').innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <select id="bizPeriodSel" style="width:auto"><option value="${currentFYLabel()}" ${bizPeriod===currentFYLabel()?'selected':''}>FY ${currentFYLabel()} (current)</option><option value="all" ${bizPeriod==='all'?'selected':''}>All time</option></select>
      <button class="btn btn-sm" id="addExpense">+ Add expense</button>
    </div>
    <div class="stat-bar">
      <div class="stat"><div class="label">Revenue</div><div class="value">${fmtMoney(totalRevenue)}</div></div>
      <div class="stat"><div class="label">Cost basis</div><div class="value">${fmtMoney(totalCost)}</div></div>
      <div class="stat"><div class="label">Net profit</div><div class="value" style="color:${totalProfit>=0?'var(--green)':'var(--red)'}">${fmtMoney(totalProfit)}</div></div>
    </div>
    ${rows.length===0 ? '<div class="empty">No spend or income recorded in this period.</div>' :
      `<table class="simple"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.type}</td><td>${esc(r.desc)}</td><td>${fmtMoney(r.revenue)}</td><td>${fmtMoney(r.cost)}</td><td style="color:${r.profit>=0?'var(--green)':'var(--red)'}">${fmtMoney(r.profit)}</td></tr>`).join('')}
      </tbody></table>`}
  `;
  document.getElementById('bizPeriodSel').addEventListener('change', e=>{ bizPeriod=e.target.value; renderBusiness(); });
  document.getElementById('addExpense').addEventListener('click', ()=>{
    const description = prompt('Expense description:'); if(!description) return;
    const amount = Number(prompt('Amount ($):','0'))||0;
    state.manualExpenses = [{ id:crypto.randomUUID(), date:new Date().toISOString().slice(0,10), description, amount }, ...state.manualExpenses];
    saveState(); renderBusiness();
  });
}

/* ---------- PWA install + service worker ---------- */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'inline-flex';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW registration failed', e));
  });
}

/* ---------- Boot ---------- */
(async function boot(){
  await initSupabase();
  await loadState();
})();
</script>
</body>
</html>
</script>
</body>
